# What the generated star schema needs to know that the business model does not otherwise
# say: which date makes an entity a measurement event, and which numbers are its measures.
#
# These are business facts -- "an order is placed on a day, and counting orders means
# counting orders" -- so every one carries its own definition. The glossary copies these
# strings; it never composes one. Names follow docs/conventions.md section 2.
uss:
  events:
    - id: PLACED
      entity: ORDER
      definition: >-
        An order was placed: the business accepted a customer's request and committed to
        supplying it. One per order, on the day it was accepted.
      kind: transaction
      date_attribute: PLACED_ON
      measures:
        - id: PLACED_ORDERS_COUNT
          definition: >-
            The number of orders placed. One for each order, counted on the day the business
            accepted it, regardless of what was on it or whether it was ever delivered.
          aggregate: count

        - id: FREIGHT_ORDERS_AMOUNT
          definition: >-
            What the business paid to have placed orders carried, attributed to the day it
            accepted each one. It is a cost of fulfilment, so it is additive over any set of
            orders and over any period -- but only over orders, since one order carries one
            freight charge however many items are on it.
          aggregate: sum
          attribute: FREIGHT_CHARGE

    - id: SHIPPED
      entity: ORDER
      definition: >-
        An order shipped: the goods left the business on their way to the destination. One per
        order, on the day they left. An order the business has not recorded as gone has no
        shipment event at all, so it is absent here rather than counted as a zero.
      kind: transaction
      date_attribute: SHIPPED_ON
      measures:
        - id: SHIPPED_ORDERS_COUNT
          definition: >-
            The number of orders that went out, counted on the day they left rather than the
            day they were accepted. An order accepted in one month and shipped in the next
            counts once, in the second.
          aggregate: count

        - id: SHIP_LAG_ORDERS_DAYS
          definition: >-
            The days orders spent waiting to go out, added up. Additive over any set of shipped
            orders and any period, because each shipped order contributes its own wait exactly
            once. The wait of a typical order is this divided by SHIPPED_ORDERS_COUNT over the
            same set -- a division a question does, and never a number this system stores.
          aggregate: sum
          attribute: SHIP_LAG_DAYS

    - id: ORDERED
      entity: ORDER_LINE
      definition: >-
        A line was ordered: the business agreed to supply one kind of goods, in a quantity, at
        a price. One per line, on the day the order carrying it was accepted -- a line has no
        day of its own.
      kind: transaction
      # Inherited along IS_PART_OF, resolved with the key and at the same instant. ADR 0009.
      date_attribute: ORDER.PLACED_ON
      measures:
        - id: REVENUE_ORDER_LINES_AMOUNT
          definition: >-
            What the business took, added up over lines. It is additive over any set of lines
            and any period, because each line contributes what it earned exactly once -- and
            it may not be added to anything measured per order, which is a different grain.
          aggregate: sum
          attribute: REVENUE
