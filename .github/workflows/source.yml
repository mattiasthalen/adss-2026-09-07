name: source

# The recording is what every build reads, so something has to say when it has gone stale.
# This is that. It is the only thing here that touches the network.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  recording:
    name: is the recording still what the source sends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --all-groups --frozen

      - name: Re-record and compare
        run: |
          uv run adss das record
          git diff --exit-code -- das/fixtures || {
            echo "::error::The source no longer sends what das/fixtures records."
            echo "Read the diff: it is the upstream change. Then update the contract if the"
            echo "shape moved, and commit the new recording."
            exit 1
          }
