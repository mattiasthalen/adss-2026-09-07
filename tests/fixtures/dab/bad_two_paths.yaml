# Two ways to reach one entity. The bridge carries one district_key and these are two answers.
model:
  id: NEUTRAL
  name: NEUTRAL
  definition: A model that reaches one entity two ways.
  description: It exists so a test proves the generator refuses rather than picks.
  entities:
    - id: PARENT
      name: PARENT
      definition: A thing that other things point at.
      description: One parent.
      attributes:
        - {id: PARENT_NUMBER, name: PARENT_NUMBER, definition: Its number., type: STRING, effective_timestamp: false}
        - {id: HAPPENED_ON, name: HAPPENED_ON, definition: When it happened., type: START_TIMESTAMP}
    - id: CHILD
      name: CHILD
      definition: A thing that points at other things.
      description: One child.
      attributes:
        - {id: CHILD_NUMBER, name: CHILD_NUMBER, definition: Its number., type: STRING, effective_timestamp: false}
        - {id: OCCURRED_ON, name: OCCURRED_ON, definition: When it occurred., type: START_TIMESTAMP}
    - id: NEIGHBOUR
      name: NEIGHBOUR
      definition: A thing that is only ever pointed at.
      description: One neighbour.
      attributes:
        - {id: NEIGHBOUR_NUMBER, name: NEIGHBOUR_NUMBER, definition: Its number., type: STRING, effective_timestamp: false}
    - id: DISTRICT
      name: DISTRICT
      definition: A thing reached two ways.
      description: One district.
      attributes:
        - {id: DISTRICT_NUMBER, name: DISTRICT_NUMBER, definition: Its number., type: STRING, effective_timestamp: false}

  relationships:
    - name: POINTS_AT
      definition: A child points at a parent.
      description: The first way round.
      source_entity_id: CHILD
      target_entity_id: PARENT
    - name: SITS_BESIDE
      definition: A child sits beside a neighbour.
      description: The second way round.
      source_entity_id: CHILD
      target_entity_id: NEIGHBOUR
    - name: BELONGS_TO
      definition: A parent belongs to a district.
      description: One route to the district.
      source_entity_id: PARENT
      target_entity_id: DISTRICT
    - name: LIES_IN
      definition: A neighbour lies in a district.
      description: The other route to the same district.
      source_entity_id: NEIGHBOUR
      target_entity_id: DISTRICT
