# One entity loaded from two tables, both with a composite source key. The check is per table,
# not per entity: keying it on the entity kept only the last one and reported nothing missing.
entity_id: PARENT
mapping_groups:
  - name: default_mapping_group
    tables:
      - connection: dev
        table: das__staged.composite_key
        primary_keys: ["cast(parent_id AS VARCHAR) || '-' || cast(child_index AS VARCHAR)"]
        ingestion_strategy: FULL_LOG
        entity_effective_timestamp_expression: extracted_at
        attributes:
          - {id: PARENT_LABEL, transformation_expression: cast(parent_label AS VARCHAR)}
      - connection: dev
        table: das__staged.other_composite
        primary_keys: ["cast(parent_id AS VARCHAR) || '-' || cast(child_index AS VARCHAR)"]
        ingestion_strategy: FULL_LOG
        entity_effective_timestamp_expression: extracted_at
        attributes:
          - {id: PARENT_LABEL, transformation_expression: cast(parent_label AS VARCHAR)}
