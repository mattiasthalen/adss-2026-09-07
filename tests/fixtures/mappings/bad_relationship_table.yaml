entity_id: CHILD
mapping_groups:
  - name: default_mapping_group
    tables:
      - connection: dev
        table: das__staged.child
        primary_keys: [child_id]
        ingestion_strategy: FULL_LOG
        entity_effective_timestamp_expression: extracted_at
        attributes:
          - {id: CHILD_NUMBER, transformation_expression: cast(child_id AS VARCHAR)}
    relationships:
      - id: CHILD_POINTS_AT_PARENT
        source_table: das__staged.children
        target_transformation_expression: parent_id
      - id: CHILD_SITS_BESIDE_NEIGHBOUR
        source_table: das__staged.child
        target_transformation_expression: neighbour_id
