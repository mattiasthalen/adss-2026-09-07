# Every hook runs from the local uv venv. Nothing is fetched, so what CI runs is pinned by
# uv.lock rather than by a remote tag that can move under us.
default_install_hook_types: [pre-commit]
fail_fast: false
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run --frozen ty check --error all
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run --frozen sqlfluff lint
        language: system
        types: [sql]
        require_serial: true
      - id: yamllint
        name: yamllint
        entry: uv run --frozen yamllint -c .yamllint.yaml --strict
        language: system
        types: [yaml]
        require_serial: true
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
